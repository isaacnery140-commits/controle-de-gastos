<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juntos</title>
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juntos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f3f4f0; --card:#ffffff; --ink:#1c211f; --muted:#66706b; --line:#dde1dc;
  --ac:#2f6f5e; --ac-ink:#fff; --ac-soft:#e2efe9;
  --out:#b3402a; --out-soft:#fbe9e4; --in:#2e7d4f; --in-soft:#e5f3ea;
  --r:16px; --nav:64px;
  --f:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614; --card:#1b201e; --ink:#e6ebe8; --muted:#97a29c; --line:#2c3430;
  --ac:#7cc4ad; --ac-ink:#0d2620; --ac-soft:#1d332c;
  --out:#ff9a86; --out-soft:#3a201b; --in:#82d4a0; --in-soft:#18301f; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--ac);color:var(--ac-ink);font-weight:700;font-size:16px}
.btn.sec{background:var(--ac-soft);color:var(--ac)}
.btn.del{background:var(--out-soft);color:var(--out)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}
.err{color:var(--out);font-size:14px;margin-top:8px}
.err:empty{display:none}

/* Login */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 22px calc(32px + env(safe-area-inset-bottom))}
#login .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;display:block}
#login h1{text-align:center;margin:0 0 4px;font-size:28px}
#login .sub{text-align:center;color:var(--muted);margin:0 0 22px}
#login .btn{margin-top:18px}
#login .troca{margin-top:14px;text-align:center;color:var(--ac);font-weight:600;padding:10px;width:100%}

/* App */
#app{min-height:100%;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 90px)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.top h2{margin:0;font-size:22px;flex:1}
.ico-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}
.espacos{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.espacos::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
main{padding:4px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mes{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.mes b{font-size:17px}
.mes button{width:40px;height:40px;border-radius:50%;font-size:22px;color:var(--ac)}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dow{font-size:12px;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;position:relative}
.cal .d.fora{color:var(--muted);opacity:.45}
.cal .d.hoje{font-weight:800;color:var(--ac)}
.cal .d.sel{background:var(--ac);color:var(--ac-ink)}
.cal .d i{width:5px;height:5px;border-radius:50%;background:var(--ac);position:absolute;bottom:6px}
.cal .d.sel i{background:var(--ac-ink)}
.dia-tit{font-weight:700;margin:16px 2px 8px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.ev .h{font-weight:700;color:var(--ac);min-width:48px;font-variant-numeric:tabular-nums}
.ev .t{font-weight:600}
.ev .s{font-size:13px;color:var(--muted)}
.ev.feito .t{text-decoration:line-through;color:var(--muted)}
.vazio{text-align:center;color:var(--muted);padding:22px 0}

/* Gastos */
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.resumo .card{margin:0}
.resumo .k{font-size:13px;color:var(--muted)}
.resumo .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.resumo .saldo{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.in{color:var(--in)} .out{color:var(--out)}
.cat{margin:10px 0}
.cat .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--out);border-radius:99px}
.lanc{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.lanc .b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.lanc .b.out{background:var(--out-soft)} .lanc .b.in{background:var(--in-soft)}
.lanc .m{flex:1;min-width:0}
.lanc .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc .s{font-size:13px;color:var(--muted)}
.lanc .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-tit{font-weight:700;margin:16px 2px 8px}

/* Compartilhar */
.opts{display:flex;gap:8px;margin-top:12px}
.opt{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.opt.on{border-color:var(--ac);background:var(--ac-soft);color:var(--ac)}
.pessoa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.pessoa .n{font-weight:700;word-break:break-all}
.pessoa .e{font-size:13px;color:var(--muted);word-break:break-all}
.pessoa .row{display:flex;gap:8px;margin-top:10px}
.pessoa .row .opt{padding:9px;font-size:14px}
.pessoa .row .x{flex:none;width:44px;padding:9px;border-radius:12px;background:var(--out-soft);color:var(--out);font-weight:700}
.pessoa .row .abrir{flex:1;padding:9px;border-radius:12px;background:var(--ac);color:var(--ac-ink);font-weight:700}

/* Navegação e botão + */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);z-index:11;width:60px;height:60px;border-radius:50%;background:var(--ac);color:var(--ac-ink);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22)}

/* Folha que sobe */
.veu{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.folha{width:100%;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s}
.veu.on .folha{transform:none}
.folha .puxa{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.folha h3{margin:4px 0 6px;font-size:20px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.tipo button{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.tipo button.on.out{border-color:var(--out);background:var(--out-soft);color:var(--out)}
.tipo button.on.in{border-color:var(--in);background:var(--in-soft);color:var(--in)}
.valor{font-size:28px;font-weight:800;text-align:center}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats .chip{font-weight:500}
.acoes{display:grid;gap:10px;margin-top:18px}
.acoes.duas{grid-template-columns:1fr 1fr}
.aviso{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.aviso.on{opacity:1}
.carregando{opacity:.55;pointer-events:none}
</style>
</head>
<body>

<!-- Login -->
<section id="login" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Juntos</h1>
  <p class="sub">Agenda e gastos</p>
  <form id="f-login" autocomplete="on">
    <div id="l-nome-box" hidden>
      <label for="l-nome">Seu nome</label>
      <input id="l-nome" maxlength="40" autocomplete="name">
    </div>
    <label for="l-email">E-mail</label>
    <input id="l-email" type="email" required autocomplete="email" inputmode="email">
    <label for="l-senha">Senha</label>
    <input id="l-senha" type="password" required minlength="6" autocomplete="current-password">
    <button class="btn" id="l-ok" type="submit">Entrar</button>
    <div class="err" id="l-err"></div>
  </form>
  <button class="troca" id="l-troca" type="button">Criar conta</button>
</section>

<!-- App -->
<section id="app" hidden>
  <div class="top">
    <div class="top-row">
      <h2 id="titulo">Agenda</h2>
      <button class="ico-btn" id="b-hoje" aria-label="Hoje">◎</button>
      <button class="ico-btn" id="b-conta" aria-label="Conta">☰</button>
    </div>
    <div class="espacos" id="espacos"></div>
  </div>

  <main>
    <!-- Agenda -->
    <div id="v-agenda">
      <div class="card">
        <div class="mes"><button id="a-ant" aria-label="Mês anterior">‹</button><b id="a-mes"></b><button id="a-prox" aria-label="Próximo mês">›</button></div>
        <div class="cal" id="cal"></div>
      </div>
      <div class="dia-tit" id="dia-tit"></div>
      <div id="dia-lista"></div>
    </div>

    <!-- Gastos -->
    <div id="v-gastos" hidden>
      <div class="mes"><button id="g-ant" aria-label="Mês anterior">‹</button><b id="g-mes"></b><button id="g-prox" aria-label="Próximo mês">›</button></div>
      <div class="resumo">
        <div class="card"><div class="k">Entradas</div><div class="v in" id="g-in">R$ 0,00</div></div>
        <div class="card"><div class="k">Saídas</div><div class="v out" id="g-out">R$ 0,00</div></div>
        <div class="card saldo"><div class="k">Saldo do mês</div><div class="v" id="g-saldo">R$ 0,00</div></div>
      </div>
      <div class="card" id="g-cats-box" hidden><div id="g-cats"></div></div>
      <div id="g-lista"></div>
    </div>

    <!-- Compartilhar -->
    <div id="v-compart" hidden>
      <form class="card" id="f-compart">
        <label for="c-email" style="margin-top:0">E-mail da pessoa</label>
        <input id="c-email" type="email" required inputmode="email" autocomplete="off" placeholder="nome@email.com">
        <div class="opts">
          <button type="button" class="opt on" data-area="agenda">📅 Agenda</button>
          <button type="button" class="opt on" data-area="gastos">💰 Gastos</button>
        </div>
        <button class="btn" style="margin-top:12px" type="submit">Compartilhar</button>
        <div class="err" id="c-err"></div>
      </form>
      <div class="sec-tit" id="c-meus-tit">Você compartilha com</div>
      <div id="c-meus"></div>
      <div class="sec-tit" id="c-comigo-tit">Compartilham com você</div>
      <div id="c-comigo"></div>
    </div>
  </main>

  <button class="fab" id="fab" aria-label="Adicionar">+</button>

  <nav>
    <button data-v="agenda" class="on"><span class="i">📅</span>Agenda</button>
    <button data-v="gastos"><span class="i">💰</span>Gastos</button>
    <button data-v="compart"><span class="i">👥</span>Compartilhar</button>
  </nav>
</section>

<!-- Folha: compromisso -->
<div class="veu" id="s-ev"><div class="folha">
  <div class="puxa"></div>
  <h3 id="ev-tit">Novo compromisso</h3>
  <form id="f-ev">
    <label for="ev-titulo">O quê</label>
    <input id="ev-titulo" required maxlength="120" autocomplete="off">
    <div class="dupla">
      <div><label for="ev-data">Dia</label><input id="ev-data" type="date" required></div>
      <div><label for="ev-hora">Hora</label><input id="ev-hora" type="time"></div>
    </div>
    <label for="ev-local">Onde</label>
    <input id="ev-local" maxlength="120" autocomplete="off">
    <label for="ev-notas">Anotações</label>
    <textarea id="ev-notas" rows="2" maxlength="1000"></textarea>
    <div class="acoes"><button class="btn" type="submit">Salvar</button></div>
    <div class="acoes duas" id="ev-extra" hidden>
      <button class="btn sec" type="button" id="ev-feito">Concluir</button>
      <button class="btn del" type="button" id="ev-del">Excluir</button>
    </div>
    <div class="err" id="ev-err"></div>
  </form>
</div></div>

<!-- Folha: lançamento -->
<div class="veu" id="s-lc"><div class="folha">
  <div class="puxa"></div>
  <h3 id="lc-tit">Novo lançamento</h3>
  <form id="f-lc">
    <div class="tipo">
      <button type="button" class="out on" data-tipo="despesa">Saída</button>
      <button type="button" class="in" data-tipo="receita">Entrada</button>
    </div>
    <label for="lc-valor">Valor</label>
    <input id="lc-valor" class="valor" required inputmode="decimal" placeholder="0,00" autocomplete="off">
    <label for="lc-desc">Descrição</label>
    <input id="lc-desc" maxlength="120" autocomplete="off">
    <label>Categoria</label>
    <div class="cats" id="lc-cats"></div>
    <label for="lc-data">Data</label>
    <input id="lc-data" type="date" required>
    <div class="acoes"><button class="btn" type="submit">Salvar</button></div>
    <div class="acoes" id="lc-extra" hidden><button class="btn del" type="button" id="lc-del">Excluir</button></div>
    <div class="err" id="lc-err"></div>
  </form>
</div></div>

<!-- Folha: conta -->
<div class="veu" id="s-conta"><div class="folha">
  <div class="puxa"></div>
  <h3 id="conta-nome"></h3>
  <div class="muted" id="conta-email"></div>
  <label for="conta-novo-nome">Seu nome</label>
  <input id="conta-novo-nome" maxlength="40">
  <div class="acoes">
    <button class="btn sec" id="conta-salvar">Salvar nome</button>
    <button class="btn del" id="conta-sair">Sair da conta</button>
  </div>
  <p class="muted" style="text-align:center;font-size:12px;margin-top:16px">v<span id="versao"></span></p>
</div></div>

<div class="aviso" id="aviso"></div>

<script>
const VERSAO = '1';
const SB_URL = 'https://pvhoumlovxjlqvmchobv.supabase.co';
const SB_KEY = 'sb_publishable_qvaNLaOJjn3i43dnzww43Q_ape3VFsV';
const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});

const CATS = {
  despesa: [['Mercado','🛒'],['Casa','🏠'],['Contas','🧾'],['Alimentação','🍔'],['Transporte','🚗'],['Saúde','💊'],['Lazer','🎉'],['Compras','🛍️'],['Educação','📚'],['Outros','•']],
  receita: [['Salário','💼'],['Extra','✨'],['Outros','•']]
};
const icone = (tipo, cat) => (CATS[tipo].find(c => c[0] === cat) || [, '•'])[1];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hojeISO = () => iso(new Date());
const deISO = s => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const maiusc = s => s.charAt(0).toUpperCase() + s.slice(1);
const nomeMes = (a, m) => maiusc(new Date(a, m, 1).toLocaleDateString('pt-BR', {month:'long'})) + ' ' + a;
const nomeDia = s => maiusc(deISO(s).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}));

let avisoT;
function aviso(t) { const a = $('aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove('on'), 2400); }

const S = {
  eu: null,            // usuário logado
  nome: '',
  espaco: null,        // id do dono cujos dados estão na tela
  recebidos: [],       // compartilhamentos que outras pessoas fizeram comigo
  meus: [],            // compartilhamentos que eu fiz
  nomes: {},           // id -> nome / email -> nome
  view: 'agenda',
  aAno: 0, aMes: 0, diaSel: hojeISO(), eventos: [],
  gAno: 0, gMes: 0, lancs: []
};
{ const d = new Date(); S.aAno = S.gAno = d.getFullYear(); S.aMes = S.gMes = d.getMonth(); }

/* ---------- Login ---------- */
let criando = false;
$('l-troca').onclick = () => {
  criando = !criando;
  $('l-nome-box').hidden = !criando;
  $('l-ok').textContent = criando ? 'Criar conta' : 'Entrar';
  $('l-troca').textContent = criando ? 'Já tenho conta' : 'Criar conta';
  $('l-senha').autocomplete = criando ? 'new-password' : 'current-password';
  $('l-err').textContent = '';
};
$('f-login').onsubmit = async e => {
  e.preventDefault();
  const email = $('l-email').value.trim().toLowerCase(), senha = $('l-senha').value, nome = $('l-nome').value.trim();
  $('l-err').textContent = ''; $('l-ok').disabled = true;
  try {
    if (criando) {
      const {data, error} = await sb.auth.signUp({email, password:senha, options:{data:{nome}, emailRedirectTo: location.origin + location.pathname}});
      if (error) throw error;
      if (!data.session) { $('l-err').style.color = 'var(--in)'; $('l-err').textContent = 'Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.'; criando = true; $('l-troca').click(); return; }
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password:senha});
      if (error) throw error;
    }
  } catch (err) {
    $('l-err').style.color = '';
    const m = String(err.message || err);
    $('l-err').textContent = /Invalid login/i.test(m) ? 'E-mail ou senha errados.' : /not confirmed/i.test(m) ? 'Confirme o e-mail pelo link que enviamos.' : /already registered/i.test(m) ? 'Esse e-mail já tem conta. Entre com ele.' : m;
  } finally { $('l-ok').disabled = false; }
};

sb.auth.onAuthStateChange((ev, sessao) => {
  const u = sessao?.user || null;
  if (u && (!S.eu || S.eu.id !== u.id)) { S.eu = u; iniciar(); }
  else if (!u) { S.eu = null; $('app').hidden = true; $('login').hidden = false; }
});

/* ---------- Início ---------- */
async function iniciar() {
  $('login').hidden = true; $('app').hidden = false;
  const email = (S.eu.email || '').toLowerCase();
  const {data: perfil} = await sb.from('juntos_perfis').select('nome').eq('id', S.eu.id).maybeSingle();
  S.nome = perfil?.nome || S.eu.user_metadata?.nome || email.split('@')[0];
  sb.from('juntos_perfis').upsert({id:S.eu.id, nome:S.nome.slice(0, 40), email}).then(() => {});
  S.espaco = localStorage.getItem('juntos.espaco.' + S.eu.id) || S.eu.id;
  const v = localStorage.getItem('juntos.view');
  await carregarCompart();
  irPara(['agenda', 'gastos', 'compart'].includes(v) ? v : 'agenda');
}

/* ---------- Espaços (meu + de quem compartilhou comigo) ---------- */
function acesso(area) {
  if (S.espaco === S.eu.id) return true;
  const c = S.recebidos.find(r => r.dono === S.espaco);
  return !!(c && c[area]);
}
async function carregarCompart() {
  const email = (S.eu.email || '').toLowerCase();
  const {data, error} = await sb.from('juntos_compart').select('*').order('criado_em');
  if (error) { aviso('Sem conexão'); return; }
  S.meus = data.filter(c => c.dono === S.eu.id);
  S.recebidos = data.filter(c => c.dono !== S.eu.id && c.email === email);
  const ids = S.recebidos.map(c => c.dono), emails = S.meus.map(c => c.email);
  if (ids.length || emails.length) {
    const ors = [];
    if (ids.length) ors.push('id.in.(' + ids.join(',') + ')');
    if (emails.length) ors.push('email.in.(' + emails.map(e => '"' + e + '"').join(',') + ')');
    const {data: ps} = await sb.from('juntos_perfis').select('id,nome,email').or(ors.join(','));
    (ps || []).forEach(p => { S.nomes[p.id] = p.nome || p.email; S.nomes[p.email] = p.nome; });
  }
  if (S.espaco !== S.eu.id && !S.recebidos.some(r => r.dono === S.espaco)) S.espaco = S.eu.id;
  desenharEspacos();
}
function desenharEspacos() {
  const box = $('espacos');
  const itens = [{id:S.eu.id, n:'Meu'}].concat(S.recebidos.map(r => ({id:r.dono, n:S.nomes[r.dono] || 'Compartilhado'})));
  box.hidden = itens.length < 2 || S.view === 'compart';
  box.innerHTML = itens.map(i => `<button class="chip${i.id === S.espaco ? ' on' : ''}" data-id="${i.id}">${esc(i.n)}</button>`).join('');
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => trocarEspaco(b.dataset.id));
}
function trocarEspaco(id) {
  S.espaco = id;
  localStorage.setItem('juntos.espaco.' + S.eu.id, id);
  desenharEspacos();
  // Se a pessoa só liberou uma das áreas, vai direto para ela.
  if (S.view !== 'compart' && !acesso(S.view)) irPara(acesso('agenda') ? 'agenda' : 'gastos');
  else carregarView();
}

/* ---------- Navegação ---------- */
const TIT = {agenda:'Agenda', gastos:'Gastos', compart:'Compartilhar'};
document.querySelectorAll('nav button').forEach(b => b.onclick = () => irPara(b.dataset.v));
function irPara(v) {
  if (v !== 'compart' && !acesso(v)) {
    // Nesse espaço a pessoa não liberou essa área: volta para o meu espaço.
    aviso((S.nomes[S.espaco] || 'Essa pessoa') + ' não compartilhou ' + (v === 'agenda' ? 'a agenda' : 'os gastos'));
    S.espaco = S.eu.id; localStorage.setItem('juntos.espaco.' + S.eu.id, S.eu.id);
  }
  S.view = v; localStorage.setItem('juntos.view', v);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ['agenda', 'gastos', 'compart'].forEach(x => $('v-' + x).hidden = x !== v);
  $('titulo').textContent = TIT[v];
  $('fab').hidden = v === 'compart';
  $('b-hoje').hidden = v === 'compart';
  desenharEspacos();
  carregarView();
  window.scrollTo(0, 0);
}
function carregarView() {
  if (S.view === 'agenda') carregarAgenda();
  else if (S.view === 'gastos') carregarGastos();
  else desenharCompart();
}
$('b-hoje').onclick = () => {
  const d = new Date();
  if (S.view === 'agenda') { S.aAno = d.getFullYear(); S.aMes = d.getMonth(); S.diaSel = hojeISO(); carregarAgenda(); }
  else { S.gAno = d.getFullYear(); S.gMes = d.getMonth(); carregarGastos(); }
};
$('fab').onclick = () => S.view === 'agenda' ? abrirEv(null) : abrirLc(null);

/* ---------- Folhas ---------- */
function abrir(id) { $(id).classList.add('on'); }
function fechar(id) { $(id).classList.remove('on'); }
document.querySelectorAll('.veu').forEach(v => v.addEventListener('click', e => { if (e.target === v) fechar(v.id); }));
document.querySelectorAll('.puxa').forEach(p => p.onclick = () => fechar(p.closest('.veu').id));

/* ---------- Agenda ---------- */
$('a-ant').onclick = () => { if (--S.aMes < 0) { S.aMes = 11; S.aAno--; } carregarAgenda(); };
$('a-prox').onclick = () => { if (++S.aMes > 11) { S.aMes = 0; S.aAno++; } carregarAgenda(); };
let pedAg = 0;
async function carregarAgenda() {
  desenharCal(); desenharDia();
  const ini = new Date(S.aAno, S.aMes, 1), fim = new Date(S.aAno, S.aMes + 1, 0);
  const de = iso(new Date(ini.getFullYear(), ini.getMonth(), 1 - ((ini.getDay() + 6) % 7)));
  const ate = iso(new Date(fim.getFullYear(), fim.getMonth(), fim.getDate() + 13));
  const p = ++pedAg;
  const {data, error} = await sb.from('juntos_eventos').select('*').eq('dono', S.espaco).gte('data', de).lte('data', ate).order('data').order('hora', {nullsFirst:true});
  if (p !== pedAg) return;
  if (error) { aviso('Sem conexão'); return; }
  S.eventos = data;
  desenharCal(); desenharDia();
}
function desenharCal() {
  $('a-mes').textContent = nomeMes(S.aAno, S.aMes);
  const ini = new Date(S.aAno, S.aMes, 1);
  const off = (ini.getDay() + 6) % 7; // semana começa na segunda
  const comEv = new Set(S.eventos.map(e => e.data));
  const hoje = hojeISO();
  let h = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(S.aAno, S.aMes, 1 - off + i), s = iso(d);
    if (i >= 35 && d.getMonth() !== S.aMes) break;
    const cls = ['d', d.getMonth() !== S.aMes && 'fora', s === hoje && 'hoje', s === S.diaSel && 'sel'].filter(Boolean).join(' ');
    h += `<button class="${cls}" data-d="${s}">${d.getDate()}${comEv.has(s) ? '<i></i>' : ''}</button>`;
  }
  $('cal').innerHTML = h;
  $('cal').querySelectorAll('.d').forEach(b => b.onclick = () => {
    S.diaSel = b.dataset.d;
    const d = deISO(S.diaSel);
    if (d.getMonth() !== S.aMes) { S.aAno = d.getFullYear(); S.aMes = d.getMonth(); carregarAgenda(); }
    else { desenharCal(); desenharDia(); }
  });
}
function desenharDia() {
  $('dia-tit').textContent = S.diaSel === hojeISO() ? 'Hoje, ' + nomeDia(S.diaSel).split(', ')[1] : nomeDia(S.diaSel);
  const evs = S.eventos.filter(e => e.data === S.diaSel);
  $('dia-lista').innerHTML = evs.length ? evs.map(e => `
    <button class="ev${e.feito ? ' feito' : ''}" data-id="${e.id}">
      <div class="h">${e.hora ? esc(e.hora) : '—'}</div>
      <div><div class="t">${e.feito ? '✓ ' : ''}${esc(e.titulo)}</div>${e.local || e.notas ? `<div class="s">${esc([e.local, e.notas].filter(Boolean).join(' · '))}</div>` : ''}</div>
    </button>`).join('') : '<div class="vazio">Nada marcado</div>';
  $('dia-lista').querySelectorAll('.ev').forEach(b => b.onclick = () => abrirEv(S.eventos.find(e => e.id === b.dataset.id)));
}
let evAtual = null;
function abrirEv(e) {
  evAtual = e;
  $('ev-tit').textContent = e ? 'Compromisso' : 'Novo compromisso';
  $('ev-titulo').value = e?.titulo || '';
  $('ev-data').value = e?.data || S.diaSel;
  $('ev-hora').value = e?.hora || '';
  $('ev-local').value = e?.local || '';
  $('ev-notas').value = e?.notas || '';
  $('ev-extra').hidden = !e;
  $('ev-feito').textContent = e?.feito ? 'Reabrir' : 'Concluir';
  $('ev-err').textContent = '';
  abrir('s-ev');
  if (!e) setTimeout(() => $('ev-titulo').focus(), 260);
}
$('f-ev').onsubmit = async ev => {
  ev.preventDefault();
  const linha = {titulo:$('ev-titulo').value.trim(), data:$('ev-data').value, hora:$('ev-hora').value || null, local:$('ev-local').value.trim(), notas:$('ev-notas').value.trim()};
  if (!linha.titulo) return;
  const f = $('f-ev'); f.classList.add('carregando');
  const {error} = evAtual
    ? await sb.from('juntos_eventos').update(linha).eq('id', evAtual.id)
    : await sb.from('juntos_eventos').insert({...linha, dono:S.espaco});
  f.classList.remove('carregando');
  if (error) { $('ev-err').textContent = 'Não foi possível salvar.'; return; }
  fechar('s-ev'); aviso(evAtual ? 'Alterado' : 'Marcado');
  S.diaSel = linha.data; const d = deISO(linha.data); S.aAno = d.getFullYear(); S.aMes = d.getMonth();
  carregarAgenda();
};
$('ev-feito').onclick = async () => {
  const {error} = await sb.from('juntos_eventos').update({feito:!evAtual.feito}).eq('id', evAtual.id);
  if (error) { $('ev-err').textContent = 'Não foi possível salvar.'; return; }
  fechar('s-ev'); carregarAgenda();
};
$('ev-del').onclick = async () => {
  if (!confirm('Excluir este compromisso?')) return;
  const {error} = await sb.from('juntos_eventos').delete().eq('id', evAtual.id);
  if (error) { $('ev-err').textContent = 'Não foi possível excluir.'; return; }
  fechar('s-ev'); aviso('Excluído'); carregarAgenda();
};

/* ---------- Gastos ---------- */
$('g-ant').onclick = () => { if (--S.gMes < 0) { S.gMes = 11; S.gAno--; } carregarGastos(); };
$('g-prox').onclick = () => { if (++S.gMes > 11) { S.gMes = 0; S.gAno++; } carregarGastos(); };
let pedG = 0;
async function carregarGastos() {
  $('g-mes').textContent = nomeMes(S.gAno, S.gMes);
  const de = iso(new Date(S.gAno, S.gMes, 1)), ate = iso(new Date(S.gAno, S.gMes + 1, 0));
  const p = ++pedG;
  const {data, error} = await sb.from('juntos_lancamentos').select('*').eq('dono', S.espaco).gte('data', de).lte('data', ate).order('data', {ascending:false}).order('criado_em', {ascending:false});
  if (p !== pedG) return;
  if (error) { aviso('Sem conexão'); return; }
  S.lancs = data;
  desenharGastos();
}
function desenharGastos() {
  let ent = 0, sai = 0; const porCat = {};
  S.lancs.forEach(l => { const v = Number(l.valor); if (l.tipo === 'receita') ent += v; else { sai += v; porCat[l.categoria] = (porCat[l.categoria] || 0) + v; } });
  $('g-in').textContent = brl(ent); $('g-out').textContent = brl(sai);
  $('g-saldo').textContent = brl(ent - sai); $('g-saldo').className = 'v ' + (ent - sai < 0 ? 'out' : 'in');
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  $('g-cats-box').hidden = !cats.length;
  $('g-cats').innerHTML = cats.map(([c, v]) => `<div class="cat"><div class="l"><span>${icone('despesa', c)} ${esc(c)}</span><b>${brl(v)}</b></div><div class="bar"><span style="width:${Math.max(3, v / cats[0][1] * 100)}%"></span></div></div>`).join('');
  if (!S.lancs.length) { $('g-lista').innerHTML = '<div class="vazio">Nenhum lançamento neste mês</div>'; return; }
  let h = '', dia = '';
  S.lancs.forEach(l => {
    if (l.data !== dia) { dia = l.data; h += `<div class="sec-tit">${esc(nomeDia(dia))}</div>`; }
    const out = l.tipo === 'despesa';
    h += `<button class="lanc" data-id="${l.id}"><div class="b ${out ? 'out' : 'in'}">${icone(l.tipo, l.categoria)}</div>
      <div class="m"><div class="t">${esc(l.descricao || l.categoria)}</div><div class="s">${esc(l.categoria)}</div></div>
      <div class="v ${out ? 'out' : 'in'}">${out ? '−' : '+'} ${brl(l.valor)}</div></button>`;
  });
  $('g-lista').innerHTML = h;
  $('g-lista').querySelectorAll('.lanc').forEach(b => b.onclick = () => abrirLc(S.lancs.find(l => l.id === b.dataset.id)));
}
let lcAtual = null, lcTipo = 'despesa', lcCat = 'Outros';
function desenharCats() {
  $('lc-cats').innerHTML = CATS[lcTipo].map(([c, i]) => `<button type="button" class="chip${c === lcCat ? ' on' : ''}" data-c="${esc(c)}">${i} ${esc(c)}</button>`).join('');
  $('lc-cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { lcCat = b.dataset.c; desenharCats(); });
}
function setTipo(t) {
  lcTipo = t;
  document.querySelectorAll('#f-lc .tipo button').forEach(b => b.classList.toggle('on', b.dataset.tipo === t));
  if (!CATS[t].some(c => c[0] === lcCat)) lcCat = CATS[t][0][0];
  desenharCats();
}
document.querySelectorAll('#f-lc .tipo button').forEach(b => b.onclick = () => setTipo(b.dataset.tipo));
function abrirLc(l) {
  lcAtual = l;
  $('lc-tit').textContent = l ? 'Lançamento' : 'Novo lançamento';
  lcCat = l?.categoria || 'Mercado';
  setTipo(l?.tipo || 'despesa');
  $('lc-valor').value = l ? Number(l.valor).toFixed(2).replace('.', ',') : '';
  $('lc-desc').value = l?.descricao || '';
  const hoje = new Date();
  $('lc-data').value = l?.data || (S.gAno === hoje.getFullYear() && S.gMes === hoje.getMonth() ? hojeISO() : iso(new Date(S.gAno, S.gMes, 1)));
  $('lc-extra').hidden = !l;
  $('lc-err').textContent = '';
  abrir('s-lc');
  if (!l) setTimeout(() => $('lc-valor').focus(), 260);
}
function lerValor(s) {
  s = String(s).replace(/[^\d,.-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const v = Math.round(parseFloat(s) * 100) / 100;
  return isFinite(v) ? v : NaN;
}
$('f-lc').onsubmit = async ev => {
  ev.preventDefault();
  const valor = lerValor($('lc-valor').value);
  if (!(valor > 0)) { $('lc-err').textContent = 'Informe o valor.'; return; }
  const linha = {tipo:lcTipo, valor, descricao:$('lc-desc').value.trim(), categoria:lcCat, data:$('lc-data').value};
  const f = $('f-lc'); f.classList.add('carregando');
  const {error} = lcAtual
    ? await sb.from('juntos_lancamentos').update(linha).eq('id', lcAtual.id)
    : await sb.from('juntos_lancamentos').insert({...linha, dono:S.espaco});
  f.classList.remove('carregando');
  if (error) { $('lc-err').textContent = 'Não foi possível salvar.'; return; }
  fechar('s-lc'); aviso('Salvo');
  const d = deISO(linha.data); S.gAno = d.getFullYear(); S.gMes = d.getMonth();
  carregarGastos();
};
$('lc-del').onclick = async () => {
  if (!confirm('Excluir este lançamento?')) return;
  const {error} = await sb.from('juntos_lancamentos').delete().eq('id', lcAtual.id);
  if (error) { $('lc-err').textContent = 'Não foi possível excluir.'; return; }
  fechar('s-lc'); aviso('Excluído'); carregarGastos();
};

/* ---------- Compartilhar ---------- */
const novo = {agenda:true, gastos:true};
document.querySelectorAll('#f-compart .opt').forEach(b => b.onclick = () => {
  novo[b.dataset.area] = !novo[b.dataset.area];
  b.classList.toggle('on', novo[b.dataset.area]);
});
$('f-compart').onsubmit = async e => {
  e.preventDefault();
  const email = $('c-email').value.trim().toLowerCase();
  $('c-err').textContent = '';
  if (!novo.agenda && !novo.gastos) { $('c-err').textContent = 'Escolha a agenda, os gastos ou os dois.'; return; }
  if (email === (S.eu.email || '').toLowerCase()) { $('c-err').textContent = 'Esse é o seu e-mail.'; return; }
  const {error} = await sb.from('juntos_compart').upsert({dono:S.eu.id, email, agenda:novo.agenda, gastos:novo.gastos}, {onConflict:'dono,email'});
  if (error) { $('c-err').textContent = 'Não foi possível compartilhar.'; return; }
  $('c-email').value = '';
  aviso('Compartilhado');
  await carregarCompart(); desenharCompart();
};
const oQue = c => [c.agenda && 'Agenda', c.gastos && 'Gastos'].filter(Boolean).join(' e ');
function desenharCompart() {
  $('c-meus-tit').hidden = !S.meus.length;
  $('c-meus').innerHTML = S.meus.map(c => `
    <div class="pessoa" data-id="${c.id}">
      <div class="n">${esc(S.nomes[c.email] || c.email)}</div>${S.nomes[c.email] ? `<div class="e">${esc(c.email)}</div>` : ''}
      <div class="row">
        <button class="opt${c.agenda ? ' on' : ''}" data-area="agenda">📅 Agenda</button>
        <button class="opt${c.gastos ? ' on' : ''}" data-area="gastos">💰 Gastos</button>
        <button class="x" aria-label="Parar de compartilhar">✕</button>
      </div>
    </div>`).join('');
  $('c-meus').querySelectorAll('.pessoa').forEach(p => {
    const c = S.meus.find(x => x.id === p.dataset.id);
    p.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
      const upd = {agenda:c.agenda, gastos:c.gastos}; upd[b.dataset.area] = !upd[b.dataset.area];
      if (!upd.agenda && !upd.gastos) return pararDe(c);
      const {error} = await sb.from('juntos_compart').update(upd).eq('id', c.id);
      if (error) { aviso('Não foi possível alterar'); return; }
      Object.assign(c, upd); desenharCompart();
    });
    p.querySelector('.x').onclick = () => pararDe(c);
  });
  $('c-comigo-tit').hidden = !S.recebidos.length;
  $('c-comigo').innerHTML = S.recebidos.map(c => `
    <div class="pessoa" data-id="${c.id}">
      <div class="n">${esc(S.nomes[c.dono] || 'Compartilhado')}</div>
      <div class="e">${esc(oQue(c))}</div>
      <div class="row">
        <button class="abrir">Abrir</button>
        <button class="x" aria-label="Sair">✕</button>
      </div>
    </div>`).join('');
  $('c-comigo').querySelectorAll('.pessoa').forEach(p => {
    const c = S.recebidos.find(x => x.id === p.dataset.id);
    p.querySelector('.abrir').onclick = () => { S.espaco = c.dono; localStorage.setItem('juntos.espaco.' + S.eu.id, c.dono); irPara(c.agenda ? 'agenda' : 'gastos'); };
    p.querySelector('.x').onclick = async () => {
      if (!confirm('Sair do que ' + (S.nomes[c.dono] || 'essa pessoa') + ' compartilhou com você?')) return;
      const {error} = await sb.from('juntos_compart').delete().eq('id', c.id);
      if (error) { aviso('Não foi possível sair'); return; }
      await carregarCompart(); desenharCompart();
    };
  });
}
async function pararDe(c) {
  if (!confirm('Parar de compartilhar com ' + (S.nomes[c.email] || c.email) + '?')) return;
  const {error} = await sb.from('juntos_compart').delete().eq('id', c.id);
  if (error) { aviso('Não foi possível alterar'); return; }
  await carregarCompart(); desenharCompart();
}

/* ---------- Conta ---------- */
$('versao').textContent = VERSAO;
$('b-conta').onclick = () => {
  $('conta-nome').textContent = S.nome; $('conta-email').textContent = S.eu.email; $('conta-novo-nome').value = S.nome;
  abrir('s-conta');
};
$('conta-salvar').onclick = async () => {
  const n = $('conta-novo-nome').value.trim().slice(0, 40); if (!n) return;
  const {error} = await sb.from('juntos_perfis').upsert({id:S.eu.id, nome:n, email:(S.eu.email || '').toLowerCase()});
  if (error) { aviso('Não foi possível salvar'); return; }
  S.nome = n; $('conta-nome').textContent = n; aviso('Nome salvo');
};
$('conta-sair').onclick = async () => { fechar('s-conta'); await sb.auth.signOut(); };

/* ---------- Atualizar sozinho ---------- */
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.eu) carregarCompart().then(carregarView); });
setInterval(() => { if (!document.hidden && S.eu && !document.querySelector('.veu.on')) carregarView(); }, 30000);

(async () => {
  const {data} = await sb.auth.getSession();
  if (!data.session) { $('login').hidden = false; }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
