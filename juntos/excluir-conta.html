<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juntos — Excluir conta</title>
<meta name="theme-color" content="#2f6f5e">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f4f0;--card:#fff;--ink:#1c211f;--muted:#66706b;--line:#dde1dc;--ac:#2f6f5e;--out:#b3402a;--out-soft:#fbe9e4;--in:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1b201e;--ink:#e6ebe8;--muted:#97a29c;--line:#2c3430;--ac:#7cc4ad;--out:#ff9a86;--out-soft:#3a201b;--in:#82d4a0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
main{max-width:460px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:24px;margin:10px 0 6px}
.muted{color:var(--muted)} a{color:var(--ac);font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:inherit;color:inherit}
button{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--out);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:14px;font-size:15px}
.err{color:var(--out)} .ok{color:var(--in);font-weight:700}
img{width:56px;height:56px;border-radius:16px}
ul{padding-left:20px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>Excluir conta do Juntos</h1>
  <p class="muted">Entre com o e-mail e a senha da conta. Serão apagados para sempre:</p>
  <ul>
    <li>compromissos da agenda</li>
    <li>lançamentos e faturas importadas</li>
    <li>compartilhamentos (feitos e recebidos)</li>
    <li>avisos e perfil</li>
  </ul>
  <form id="f">
    <label for="email">E-mail</label>
    <input id="email" type="email" required autocomplete="email">
    <label for="senha">Senha</label>
    <input id="senha" type="password" required autocomplete="current-password">
    <label for="conf">Digite EXCLUIR para confirmar</label>
    <input id="conf" required autocomplete="off" autocapitalize="characters">
    <button id="ok" type="submit">Excluir minha conta</button>
  </form>
  <div class="msg" id="msg"></div>
  <p style="margin-top:28px"><a href="privacidade.html">Política de privacidade</a> · <a href="./">Abrir o app</a></p>
</main>
<script>
const sb = window.supabase.createClient('https://pvhoumlovxjlqvmchobv.supabase.co', 'sb_publishable_qvaNLaOJjn3i43dnzww43Q_ape3VFsV', {auth:{persistSession:false}});
const $ = id => document.getElementById(id);
const msg = (t, c) => { $('msg').className = 'msg ' + (c || ''); $('msg').textContent = t; };
$('f').onsubmit = async e => {
  e.preventDefault();
  if ($('conf').value.trim().toUpperCase() !== 'EXCLUIR') { msg('Digite EXCLUIR para confirmar.', 'err'); return; }
  $('ok').disabled = true; msg('Excluindo…');
  try {
    const {error} = await sb.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(), password:$('senha').value});
    if (error) throw new Error(/Invalid login/i.test(error.message) ? 'E-mail ou senha errados.' : error.message);
    const {error:e2} = await sb.rpc('juntos_excluir_conta');
    if (e2) throw new Error('Não foi possível excluir agora. Tente de novo mais tarde.');
    await sb.auth.signOut().catch(() => {});
    $('f').hidden = true;
    msg('Pronto. Sua conta e seus dados do Juntos foram excluídos.', 'ok');
  } catch (err) { msg(err.message, 'err'); $('ok').disabled = false; }
};
</script>
</body>
</html>
